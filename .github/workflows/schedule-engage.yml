name: 每日回覆潛在客戶

# 每天台灣時間 21:00（UTC 13:00）掃描自己貼文的留言，自動回覆潛在客戶
# 需要帳號有 threads_manage_replies 或 threads_read_replies 權限才能讀取他人留言

on:
  # ⏸️ 排程已暫停：engage 需要 threads_manage_replies 權限才能讀取留言，
  #    在權限核准前每天自動跑只會空轉、燒 Actions 配額（見 docs/改進計劃.md P0-1）。
  #    權限到位後，取消下面兩行的註解即可恢復每天 21:00 自動執行。
  # schedule:
  #   - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # 失敗時開 issue 告警

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 回覆潛在客戶留言
        run: npm run engage -- --yes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_REFRESHED_AT: ${{ secrets.THREADS_TOKEN_REFRESHED_AT }}

      - name: 失敗時開 issue 告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ ${{ github.workflow }} 執行失敗"
          BODY=$(printf '%s\n\n%s' \
            "Workflow **${{ github.workflow }}** 於 $(date -u '+%Y-%m-%d %H:%M UTC') 失敗。" \
            "Run log：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          # 同一 workflow 已有未關閉的失敗 issue 就改用留言，避免洗版
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
