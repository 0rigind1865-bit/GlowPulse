name: 每日隨機貼文

# 每天隨機選一個時段、隨機選一種貼文類型發布
#
# 設計原理：
#   - 設定 5 個可能的 UTC 觸發時段（對應台灣 09:00 ~ 21:00）
#   - 每個時段觸發後，用當天日期的 hash 決定「今日選定時段」
#   - 只有選定時段的那次觸發才真正執行，其餘立即退出（不浪費分鐘數）
#   - 發文類型在執行時用 $RANDOM 三選一：長文 / 短文 / 圖片貼文

on:
  schedule:
    - cron: '0 1 * * *'    # 台灣 09:00
    - cron: '0 4 * * *'    # 台灣 12:00
    - cron: '0 7 * * *'    # 台灣 15:00
    - cron: '0 10 * * *'   # 台灣 18:00
    - cron: '0 13 * * *'   # 台灣 21:00
  workflow_dispatch:
    inputs:
      post_type:
        description: '發文類型（auto = 隨機）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - long
          - short
          - image
      use_latest:
        description: '圖片貼文使用最新截圖（--latest）'
        required: false
        default: false
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # 失敗時開 issue 告警

    steps:
      - name: 決定今日是否在此時段發文
        id: gate
        run: |
          # 手動觸發一律放行（後續步驟的 if 條件也有涵蓋，這裡避免空字串比較報錯）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> $GITHUB_OUTPUT
            echo "▶️  手動觸發，直接執行。"
            exit 0
          fi

          # 5 個可能的 UTC 小時（對應上方 cron）
          SLOTS=(1 4 7 10 13)

          # 用當天日期做 checksum，取餘數決定今日選定時段索引
          SEED=$(date -u +%Y%m%d | cksum | awk '{print $1}')
          IDX=$((SEED % 5))
          TODAY_SLOT=${SLOTS[$IDX]}

          # 用「觸發本次執行的 cron 表達式」判斷，而非目前時間：
          # GitHub cron 常延遲超過一小時，若用 date 取當下小時，
          # 延遲跨過整點就會誤判跳過，導致整天漏發
          CRON_HOUR=$(echo "${{ github.event.schedule }}" | awk '{print $2}')

          TW_HOUR=$((TODAY_SLOT + 8))
          echo "today_slot=${TODAY_SLOT}" >> $GITHUB_OUTPUT

          if [ "$CRON_HOUR" -eq "$TODAY_SLOT" ]; then
            echo "active=true" >> $GITHUB_OUTPUT
            echo "✅ 今日選定時段 UTC ${TODAY_SLOT}（台灣 ${TW_HOUR}:00），本次觸發來自該時段 cron，繼續執行。"
          else
            echo "active=false" >> $GITHUB_OUTPUT
            echo "⏭️  今日選定時段 UTC ${TODAY_SLOT}（台灣 ${TW_HOUR}:00），本次觸發來自 UTC ${CRON_HOUR} 的 cron，跳過。"
          fi

      - name: Checkout
        if: steps.gate.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: 選擇發文類型並發布
        if: steps.gate.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # 決定發文類型：手動指定優先，否則隨機
          POST_TYPE="${{ github.event.inputs.post_type }}"
          if [ -z "$POST_TYPE" ] || [ "$POST_TYPE" = "auto" ]; then
            TYPE=$((RANDOM % 3))
          elif [ "$POST_TYPE" = "long" ]; then
            TYPE=0
          elif [ "$POST_TYPE" = "short" ]; then
            TYPE=1
          elif [ "$POST_TYPE" = "image" ]; then
            TYPE=2
          else
            TYPE=$((RANDOM % 3))
          fi

          case $TYPE in
            0)
              echo "📝 類型：長文貼文"
              npm run post -- --yes
              ;;
            1)
              echo "💬 類型：短文貼文（130 字）"
              npm run post -- --yes --max-chars 130
              ;;
            2)
              echo "🖼️  類型：圖片貼文"
              if [ "${{ github.event.inputs.use_latest }}" = "true" ]; then
                npm run image-post -- --yes --latest
              else
                npm run image-post -- --yes
              fi
              ;;
          esac
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_REFRESHED_AT: ${{ secrets.THREADS_TOKEN_REFRESHED_AT }}

      - name: 失敗時開 issue 告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ ${{ github.workflow }} 執行失敗"
          BODY=$(printf '%s\n\n%s' \
            "Workflow **${{ github.workflow }}** 於 $(date -u '+%Y-%m-%d %H:%M UTC') 失敗。" \
            "Run log：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          # 同一 workflow 已有未關閉的失敗 issue 就改用留言，避免洗版
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
