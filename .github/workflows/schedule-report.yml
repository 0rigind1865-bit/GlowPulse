name: 每週成效報告

# 每週一台灣時間 09:00（UTC 01:00）產生上週發文成效週報
# AI 分析高低互動差異，自動更新 brand.ts / styles.ts，並將報告 commit 回 repo

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # 允許建立 branch 與 push
      pull-requests: write  # 允許建立 PR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 產生週報並更新 data 層
        run: npm run report -- --yes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_REFRESHED_AT: ${{ secrets.THREADS_TOKEN_REFRESHED_AT }}

      - name: 從品牌技巧衍生新發文風格
        # 在週報更新 brand.ts 之後執行，確保讀到最新的技巧清單
        # 只新增尚未涵蓋的風格，不改寫現有風格
        run: npm run gen-styles -- --yes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 推送週報到 main，並為 data 層變更建立 PR
        run: |
          git config user.name  "GlowPulse Bot"
          git config user.email "bot@glowpulse.local"

          DATE="$(date '+%Y-%m-%d')"

          # data 層為已追蹤檔案，可直接用 git diff 偵測是否有改動
          DATA_CHANGED=false
          git diff --quiet -- src/data/brand.ts src/data/styles.ts || DATA_CHANGED=true

          # 先把 data 層變更暫存起來，讓週報能乾淨地 rebase / push 上 main
          if [ "$DATA_CHANGED" = true ]; then
            git stash push -- src/data/brand.ts src/data/styles.ts
          fi

          # ── (1) 週報純屬資訊性快照，直接 commit 進 main，網頁立即可見 ──
          #    （報告是新檔，須先 git add 才能用 --staged 偵測）
          git add docs/reports/
          if git diff --staged --quiet; then
            echo "本週無新報告，跳過推送 main。"
          else
            git commit -m "chore: 自動週報 $DATE"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "✅ 週報已推送到 main，網頁即可看到最新報告。"
          fi

          # ── (2) data 層（brand.ts / styles.ts）會影響日後發文，需人工審核 → 獨立開 PR ──
          if [ "$DATA_CHANGED" != true ]; then
            echo "data 層無變更，不建立 PR。"
            exit 0
          fi

          git stash pop

          # 建立當日的 bot branch（同天重跑則刪掉重建）
          BRANCH="bot/weekly-data-$DATE"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add src/data/brand.ts src/data/styles.ts
          git commit -m "chore: 週報 data 層更新 $DATE"
          git push origin "$BRANCH"

          # PR body 寫入暫存檔，避免多行字串在 shell 中的縮排問題
          cat > /tmp/pr_body.md << 'PREOF'
          ## AI 依本週成效調整發文策略

          本週報告已自動進 main（見 `docs/reports/`），網頁可直接查看。
          以下 data 層調整會影響日後發文，請確認後再 merge：

          - `src/data/brand.ts` 寫作技巧（如有更新）
          - `src/data/styles.ts` 發文風格（如有更新）

          > ⚠️ **請先看 Files changed tab 確認 AI 的建議符合品牌方向，再 merge。**
          > 特別注意 styles.ts — AI 有時會改寫原有風格指令，不只新增。

          🤖 由 GlowPulse Bot 自動建立
          PREOF

          gh pr create \
            --title "🎨 週報 data 層更新 $DATE" \
            --body-file /tmp/pr_body.md \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
